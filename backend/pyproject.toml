[project]
name = "deepresearch-backend"
version = "0.0.1"
description = "基于 LangGraph 的深度研究与文档 RAG 系统。"
authors = []
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "tavily-python>=0.5.0",
    "python-dotenv==1.0.1",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "uvicorn[standard]>=0.32.0",
    "ddgs>=9.6.1",
    "loguru>=0.7.3",
    "huggingface-hub>=1.19.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]
rag-extra = [
    "sentence-transformers>=3.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "config", "main", "models", "prompts", "utils"]
packages = ["services"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.7",
]
